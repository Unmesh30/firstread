[project]
name = "firstread-ml"
version = "0.1.0"
description = "FirstRead offline training and evaluation on MIND."
requires-python = ">=3.12,<3.13"
dependencies = [
  "firstread-core[embed]",
  "polars>=2.0.0",
  "scikit-learn>=1.9.1",
  "matplotlib>=3.11.2",
  # fastembed 0.9.0 caps huggingface-hub below 2.0.
  "huggingface-hub>=0.36,<2.0",
]

[project.scripts]
firstread-ml = "firstread_ml.cli:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"

[tool.uv.sources]
firstread-core = { workspace = true }
