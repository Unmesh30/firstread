# Git hooks run on every commit. Install with `make setup` (or `uv run pre-commit install`).
# Run on everything: `uv run pre-commit run --all-files`.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Generated matplotlib SVGs carry trailing spaces in path data.
      - id: trailing-whitespace
        exclude: ^ml/reports/figures/.*\.svg$
      - id: end-of-file-fixer
        exclude: ^ml/reports/figures/.*\.svg$
      - id: check-yaml
      - id: check-toml
      - id: check-json
        exclude: ^apps/mobile/tsconfig\.json$
      - id: check-added-large-files
        args: ["--maxkb=500"]
        exclude: ^apps/mobile/(package-lock\.json|assets/)
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      # Runs in the project venv so mypy sees the real installed dependencies.
      - id: mypy
        name: mypy
        entry: uv run --frozen mypy
        language: system
        types: [python]
        pass_filenames: false
