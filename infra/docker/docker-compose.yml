# Local development stack: Postgres 17 + pgvector, Redis 7, and the API with hot reload.
# Run from the repo root with `make up` (uses ../../.env).
name: firstread

services:
  db:
    image: pgvector/pgvector:0.8.7-pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-firstread}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-firstread}
      POSTGRES_DB: ${POSTGRES_DB:-firstread}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4.11-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
      target: dev
    env_file:
      - path: ../../.env
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-firstread}:${POSTGRES_PASSWORD:-firstread}@db:5432/${POSTGRES_DB:-firstread}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - ../../services/api/src:/app/services/api/src
      - ../../packages/core/src:/app/packages/core/src
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz', timeout=2).status == 200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  pgdata:
