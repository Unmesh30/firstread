[project]
name = "firstread-api"
version = "0.0.0"
description = "FirstRead recommendation API (FastAPI)."
requires-python = ">=3.12,<3.13"
dependencies = [
  "firstread-core[db]",
  "fastapi>=0.143.0",
  "uvicorn[standard]>=0.54.0",
  "asyncpg>=0.32.0",
  "redis>=8.1.0",
  "pydantic-settings>=2.15.0",
  "structlog>=26.1.0",
  # >= 2.13.0 for CVE-2026-48522 (PyJWKClient fetched any URI scheme). We fetch the
  # JWKS ourselves with httpx from a configured https URL and never use PyJWKClient.
  "pyjwt[crypto]>=2.15.1",
  "httpx>=0.28.1",
  "prometheus-client>=0.26.0",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"

[tool.uv.sources]
firstread-core = { workspace = true }
