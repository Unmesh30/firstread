# Curated RSS feeds (ADR 0007). Policy:
# - Only feeds a publisher lists on its own RSS page for syndication, and whose terms
#   allow showing the headline + link with attribution (rss_page_url, terms_url).
# - We store headline, link, time and thumbnail only. The description is used in
#   memory to build the embedding text and is never stored (SPEC section 4).
# - geo: `us` for US-domestic coverage, `intl` otherwise (Guardian US = us). It drives
#   the geo rule in firstread_core.topics.resolve_topic.
# - topic_hint breaks ties only when the classifier is unsure (ADR 0006).
# - A feed with unclear terms ships `enabled: false` until the owner decides.
