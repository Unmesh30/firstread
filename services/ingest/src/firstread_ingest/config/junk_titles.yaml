# Titles dropped by normalize.py (Phase 2 plan, owner review):
# - `whole`: dropped only if the WHOLE normalized title (casefolded, punctuation
#   stripped) equals one of these.
# - `media_prefixes`: dropped if the title STARTS with one of these markers.
# "Live updates: ..." and "Opinion: ..." are deliberately kept: live blogs carry
# breaking news, and opinion maps to politics.
version: 1
whole:
  - live updates
  - live
  - photos
  - video
  - videos
  - watch
  - podcast
  - newsletter
  - todays headlines
  - the latest
  - quiz
  - crossword
  - horoscope
  - sponsored
  - advertisement
  - page not found
  - access denied
  - just a moment
media_prefixes:
  - "watch:"
  - "video:"
  - "photos:"
  - "podcast:"
  - "quiz:"
# Section pages stored as if they were articles: "Health - Carroll Broadcasting Inc.".
# A title is a section page when one side of a " - " / " | " / " – " split is one of
# these section names and the other side names an outlet or company (the article's own
# source, or a short name ending in a company/media word). "Health - New study links
# sleep to memory" is kept: its other side is a headline, not a name.
sections:
  - news
  - local news
  - health
  - business
  - sports
  - sport
  - entertainment
  - world
  - world news
  - us news
  - politics
  - opinion
  - technology
  - tech
  - science
  - lifestyle
  - weather
  - travel
  - food
  - arts
  - culture
  - education
  - money
  - obituaries
  - home
outlet_words:
  - inc
  - llc
  - ltd
  - corp
  - corporation
  - company
  - co
  - group
  - media
  - broadcasting
  - broadcast
  - network
  - networks
  - radio
  - tv
  - television
  - news
  - newspaper
  - times
  - post
  - herald
  - journal
  - gazette
  - tribune
  - daily
# Templated non-articles (ADR 0007, P3e amendment). Each one is a page that changes
# content through the day under a near-identical title, so ingestion clusters
# different pages as one story (ADR 0013) and they pass the personas' 6-word rule.
# Anchored at both ends and matched case-insensitively with Python `re.search` on the
# title after the outlet suffix is stripped. Each name is a drop reason
# (junk_title:<name>) in the run summary. Derived from the 3-day replay's titles.
patterns:
  # AP's rolling digests, republished by member papers:
  #   dropped: "AP News Summary at 2:50 p.m. EDT", "AP News in Brief at 9:04 p.m. EDT",
  #            "AP News Digest 6 a.m."
  #   kept:    "AP News: Senate passes the budget" (a headline after the brand)
  #            "Iran News in Brief – October 12, 2026" (not AP; out of scope)
  # A trailing " - <outlet>" is allowed: whatever follows, the page is still a digest.
  ap_digest: >-
    ^ap news (summary|in brief|digest),? (at )?\d{1,2}(:\d{2})? ?[ap]\.? ?m\.?( [ecmp][sd]?t)?(\s+[-|–—]\s+.{1,80})?$
  # A weather forecast named only by its date: no place, storm or warning.
  #   dropped: "Weather forecast for October 14th", "Weather Forecast For Wednesday
  #            October 14", "Weather forecast, October 14",
  #            "Weather Forecast for Monday, October 12, 2026",
  #            "Weather & Atmospheric Forecast October 12th"
  #   kept:    "Omaha morning weather forecast for Tuesday, October 13" (a place)
  #            "Weather forecast: High pressure building this week" (content)
  #            "Weather forecast, October 14 - Storm warning for the coast" (no suffix
  #            allowed here: what follows a date can be real weather news)
  dated_weather_forecast: >-
    ^weather( (and|&) atmospheric)? forecast,?( for)?( (mon|tues|wednes|thurs|fri|satur|sun)day,?)? (jan|feb|mar|apr|may|jun|jul|aug|sep|sept|oct|nov|dec)[a-z]*\.? \d{1,2}(st|nd|rd|th)?(,? 20\d{2})?\.?$
