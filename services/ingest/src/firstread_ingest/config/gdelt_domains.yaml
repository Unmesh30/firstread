# GDELT GKG source filtering (ADR 0007). Reviewed by the owner.
#
# overrides: the 2015-2021 lookup places an outlet in the country it MENTIONS most,
# which is wrong for international outlets that cover the US heavily. FIPS 10-4
# codes, like the lookup. Evidence: probe of 2026-10-14 (lookup value, top share).
#
# blocklist: domains whose GKG records are auto-generated or syndicated copies, not
# original reporting. A blocked domain's records are dropped before ranking.
#
# press_wires: press-release distribution and republishing sites. Syndicated releases
# appear on many outlets at once, so they look like broad coverage and would win the
# breadth ranking and trending. Dropped before ranking, counted as press_wire_domain.
#
# press_release_paths: real outlets that also host syndicated releases under a known
# URL path segment (domain -> segments). Those URLs are dropped before ranking,
# counted as press_wire_path; the outlet's own reporting is kept.
#
# Domain counts below are GKG records in the 3-day replay (2026-10-12 to 10-15), from
# the review list in PR #12 (reviewed by the owner on 2026-10-18).
version: 1
overrides:
  aljazeera.com: QA        # lookup US (0.36)
  reuters.com: UK          # lookup US (0.36)
  economist.com: UK        # lookup US (0.43)
  euronews.com: FR         # lookup US (0.27)
  politico.eu: BE          # lookup US (0.26)
  trtworld.com: TU         # lookup IR (0.27)
  thenationalnews.com: AE  # lookup UK (0.31)
  africanews.com: CF       # lookup NI (0.33)
blocklist:
  # Auto-generated stock-ticker articles (one network, many domains).
  - themarketsdaily.com
  - tickerreport.com
  - dailypolitical.com
  - theenterpriseleader.com
  - modernreaders.com
  - etfdailynews.com
  - wkrb13.com
  - zolmax.com
  - americanbankingnews.com
  - marketbeat.com
  # Syndicated copies of wire and local stories across radio-station sites (9% of a file).
  - iheart.com
  # A court-records database, not news (templated "X vs The State Of Y on <date>" titles).
  - indiankanoon.org
  # Not news: listicles, stock tips, automated market summaries, event calendars.
  - boredpanda.com      # viral listicles (1,793 records)
  - fool.com            # stock-pick and retirement advice (830)
  - 247wallst.com       # stock-pick and retirement advice (436)
  - rttnews.com         # automated market summaries, "Asian Markets Trade Mixed" (560)
  - hamlethub.com       # community events calendar (370)
  # Aggregators that republish other outlets' stories (and inflate trending breadth).
  - prokerala.com       # republishes IANS/ANI wire copy (878)
  - webindia123.com     # republishes IANS/ANI wire copy (752)
  - wn.com              # World News aggregator (414)
  - el-balad.com        # machine-written sports and betting copy (520)
  - ghanamma.com        # rewrites of other outlets' football and celebrity stories (1,239)
  - aol.com             # syndicated copies of other outlets, e.g. Motley Fool (2,061)
  - aol.co.uk           # syndicated copies of other outlets, e.g. PA (1,900)
  - netscape.com        # portal republishing AP wire copy (87 coverage rows in 48 h), 2026-10-22
  # Big News Network: one publisher, 100 domains. Every record has the URL shape
