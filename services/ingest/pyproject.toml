[project]
name = "firstread-ingest"
version = "0.0.0"
description = "FirstRead news ingestion job."
requires-python = ">=3.12,<3.13"
dependencies = [
  "firstread-core[embed,db]",
  "httpx==0.28.1",
  "feedparser==6.0.14",
  "pgvector==0.5.1",
  "onnxruntime==1.31.0",
  # fastembed 0.9.0 caps huggingface-hub below 2.0 (same constraint as ml).
  "huggingface-hub>=0.36,<2.0",
  "pyyaml>=6.0.3",
  "pydantic-settings>=2.15.0",
  "structlog>=26.1.0",
]

[project.scripts]
firstread-ingest = "firstread_ingest.main:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"

[tool.uv.sources]
firstread-core = { workspace = true }
