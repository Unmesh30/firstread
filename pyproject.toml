[project]
name = "firstread"
version = "0.0.0"
description = "FirstRead monorepo root (uv workspace)."
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
  "firstread-core",
  "firstread-api",
  "firstread-ingest",
  "firstread-ml",
  "ruff>=0.17.0",
  "mypy>=2.4.0",
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "httpx2>=2.13.1",
  "pre-commit>=4.7.0",
  "respx==0.23.1",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/core", "services/api", "services/ingest", "ml"]

[tool.uv.sources]
firstread-core = { workspace = true }
# CPU-only torch on Linux (CI, Docker); see https://docs.astral.sh/uv/guides/integration/pytorch/
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
firstread-api = { workspace = true }
firstread-ingest = { workspace = true }
firstread-ml = { workspace = true }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# ---------- ruff ----------
[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["apps", "data"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "N", "ASYNC", "S", "PT"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["firstread_core", "firstread_api", "firstread_ingest", "firstread_ml"]

# ---------- mypy ----------
[tool.mypy]
python_version = "3.12"
files = [
  "packages/core/src", "packages/core/tests",
  "services/api/src", "services/api/tests",
  "services/ingest/src", "services/ingest/tests",
  "ml/src", "ml/tests",
  "services/api/scripts/persona_replay.py", "loadtest",
]
strict = true
warn_unreachable = true
pretty = true
# Its fixtures live in firstread_ingest.testing; the file only re-exports them, and
# a second module named "conftest" (next to services/api's) would clash in mypy.
exclude = ['^services/ingest/tests/conftest\.py$']

# ml is research code: type-checked, but not strictly.
[[tool.mypy.overrides]]
module = ["firstread_ml", "firstread_ml.*"]
strict = false
disallow_untyped_defs = false
disallow_untyped_calls = false  # torch's Tensor.backward is untyped

# ml's tests (package "tests" via ml/tests/__init__.py) call torch the same way.
[[tool.mypy.overrides]]
module = ["tests", "tests.*"]
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = [
  "asyncpg", "asyncpg.*", "sklearn", "sklearn.*", "yaml", "joblib",
  "onnxruntime", "onnxruntime.*", "skl2onnx", "skl2onnx.*", "feedparser", "pgvector",
  "pgvector.*",
]
ignore_missing_imports = true

# ---------- pytest ----------
[tool.pytest.ini_options]
testpaths = ["packages/core/tests", "services/api/tests", "services/ingest/tests", "ml/tests"]
addopts = ["--import-mode=importlib", "-ra", "--strict-markers"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "integration: needs a running Postgres and Redis (make up)",
  "model: downloads the pinned embedding model (~67 MB, cached)",
  "supabase: needs a supabase/postgres container (SUPABASE_TEST_URL, CI job `supabase`)",
]
