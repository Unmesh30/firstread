name: Bug report
description: Something is broken
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: "1. make up\n2. curl ...\n3. ..."
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [app, api, ingest, ml, infra, docs]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Remove any secrets or tokens before pasting.
      render: shell
