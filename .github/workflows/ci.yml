name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_USER: firstread
          POSTGRES_PASSWORD: firstread
          POSTGRES_DB: firstread
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U firstread -d firstread"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4.11-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      APP_ENV: test
      DATABASE_URL: postgresql://firstread:firstread@localhost:5432/firstread
      REDIS_URL: redis://localhost:6379/0
      # Integration tests must run (not skip) in CI.
      REQUIRE_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes no floating major tag, so pin the release commit.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --all-packages --frozen
      # The pinned embedding model (~67 MB) for the golden-vector test.
      - name: Cache embedding model
        uses: actions/cache@v6
        with:
          path: ~/.cache/firstread/models
          key: embed-model-${{ hashFiles('packages/core/src/firstread_core/embedding.py') }}
      - name: Ruff lint
        run: uv run --frozen ruff check --output-format=github .
      - name: Ruff format
        run: uv run --frozen ruff format --check .
      - name: Mypy
        run: uv run --frozen mypy
      - name: Pytest
        run: uv run --frozen pytest
      # Ingestion runs ONNX Runtime only (ADR 0005/0006): ML training libraries must
      # never be in its dependency tree.
      - name: No ML training dependencies in ingest
        run: |
          bad=$(uv export --package firstread-ingest --no-dev --frozen --no-hashes \
            | grep -iE '^(torch|scikit-learn|onnx|skl2onnx|onnxscript|polars|mlflow)==' || true)
          echo "ML packages in ingest: ${bad:-none}"
          test -z "$bad"

  supabase:
    name: supabase
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The real Supabase Postgres image: `postgres` is not a superuser and the anon /
    # authenticated roles exist, as on hosted Supabase (P5). Pin the tag deliberately.
    services:
      supabase:
        image: supabase/postgres:17.11.0.004
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -h localhost"
          --health-interval 5s --health-timeout 3s --health-retries 30
    env:
      SUPABASE_TEST_URL: postgresql://postgres:postgres@localhost:54329/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --all-packages --frozen
      - name: Migrations on the Supabase image (RLS, non-superuser)
        run: uv run --frozen pytest -m supabase packages/core/tests/test_supabase_compat.py -v

  mobile:
    name: mobile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      # Fails (exit 1) if any installed Expo/React Native package doesn't match
      # the Expo SDK, e.g. after a partial SDK bump.
      - name: Expo SDK version check
        run: npx expo install --check
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - name: Web export (GitHub Pages build)
        run: npx expo export -p web

  docker:
    name: docker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build API image (runtime target, not pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/api.Dockerfile
          target: runtime
          push: false
          load: true
          tags: firstread-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image
        run: |
          docker run -d --name api -p 8000:8000 firstread-api:ci
          for i in $(seq 1 20); do curl -fsS localhost:8000/healthz && exit 0; sleep 1; done
          docker logs api; exit 1
      # The API never trains or embeds text: ML deps must stay out of the image.
      - name: No ML dependencies in the image
        run: |
          docker image inspect firstread-api:ci --format 'image size: {{.Size}} bytes'
          docker run --rm --entrypoint python firstread-api:ci -c "
          import importlib.util, sys
          bad = [m for m in ('torch', 'fastembed', 'sklearn', 'polars', 'onnx', 'matplotlib')
                 if importlib.util.find_spec(m)]
          print('ML packages in image:', bad or 'none')
          sys.exit(1 if bad else 0)"

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      # From the release's gitleaks_<version>_checksums.txt (linux_x64). Update with the version.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks && rm gitleaks.tar.gz
      - name: Scan full git history
        run: ./gitleaks git --redact --verbose --exit-code 1 .
