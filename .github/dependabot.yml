version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: npm
    directory: /apps/mobile
    schedule:
      interval: weekly
    groups:
      # Expo pins SDK-compatible versions; bump the SDK deliberately with `npx expo install --fix`.
      expo:
        patterns: ["expo", "expo-*", "react", "react-dom", "react-native", "react-native-*", "@expo/*", "jest-expo", "eslint-config-expo"]
      dev-tools:
        dependency-type: development
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: docker
    directory: /infra/docker
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
