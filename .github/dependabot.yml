version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: npm
    directory: /apps/mobile
    schedule:
      interval: weekly
    groups:
      # Expo pins SDK-compatible versions; bump the SDK deliberately with `npx expo install --fix`.
      expo:
        patterns: ["expo", "expo-*", "@expo/*", "react", "react-dom", "react-native", "react-native-*", "jest-expo", "eslint-config-expo", "@types/react"]
      dev-tools:
        dependency-type: development
    ignore:
      # Expo group: no Dependabot updates at all. react must exactly match the
      # renderer bundled with React Native, and every SDK package is pinned by
      # the Expo SDK, so these move only with `npx expo install --fix` (the weekly
      # expo-check.yml workflow catches drift). Omitting update-types
      # ignores every update for the dependency.
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "@expo/*"
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      - dependency-name: "jest-expo"
      - dependency-name: "eslint-config-expo"
      - dependency-name: "@types/react"
      # Dev-tools group: no majors (e.g. jest-expo 57 needs jest 29). Keep this
      # list in sync with the non-Expo devDependencies in apps/mobile/package.json.
      - dependency-name: "@testing-library/react-native"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/jest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-config-prettier"
        update-types: ["version-update:semver-major"]
      - dependency-name: "jest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "prettier"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: docker
    directory: /infra/docker
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
