[project]
name = "firstread-core"
version = "0.1.0"
description = "Shared code for FirstRead: text, embeddings, features, schemas."
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=2.5.4", "pyyaml>=6.0.3"]

[project.optional-dependencies]
# The embedding backend (ONNX Runtime + tokenizers). ml and ingest install it;
# the API image does not (it never embeds text). Pinned exactly: a different
# fastembed can change vectors, which is train/serve skew.
embed = ["fastembed==0.9.0"]
# Postgres helpers (connect with the Supabase-pooler setting, migrations).
db = ["asyncpg==0.32.0"]

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"
